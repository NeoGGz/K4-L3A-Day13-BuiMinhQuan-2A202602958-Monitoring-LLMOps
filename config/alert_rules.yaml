alerts:
  - name: ElevatedUserLatency
    severity: warning
    condition: 'latency_p95_ms > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: platform-on-call
    runbook: docs/alerts.md#alert-1
  - name: UserRequestErrors
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: api-on-call
    runbook: docs/alerts.md#alert-2
  - name: DegradedAnswerQuality
    severity: warning
    condition: 'retrieval_success_rate_pct < 90 or quality_score_avg < 0.75'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: llm-on-call
    runbook: docs/alerts.md#alert-3
